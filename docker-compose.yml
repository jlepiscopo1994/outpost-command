version: '3.8'

services:
  outpost-db:
    image: pgvector/pgvector:pg16 # Swapped for native pgvector support
    container_name: outpost_postgres
    environment:
      POSTGRES_DB: outpost_db
      POSTGRES_USER: commander
      POSTGRES_PASSWORD: outpost_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: